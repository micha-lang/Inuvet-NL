        function useCountdown(deadlineISO) {
            const deadline = useMemo(() => new Date(deadlineISO).getTime(), [deadlineISO]);
            const [now, setNow] = useState(Date.now());
            useEffect(() => {
                const id = setInterval(() => setNow(Date.now()), 1000);
                return () => clearInterval(id);
            }, []);
            const diff = Math.max(0, deadline - now);
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);
            return { days, hours, minutes, seconds, expired: diff <= 0 };
        }

                        )}
                        <div>
                            <div className="text-sm font-semibold text-neutral-900">{name}</div>
                            {role && <div className="text-xs text-neutral-600">{role}</div>}
                            <div className="text-xs mt-1" aria-label={`Bewertung ${r} von 5`}>
                                {Array.from({ length: 5 }).map((_, i) => (
                                    <span key={i} style={{ color: i < r ? '#f59e0b' : "#d1d5db" }}>★</span>
                                ))}
                            </div>
                        </div>
                    </div>
                    <blockquote className="mt-3 text-sm text-neutral-800">“{text}”</blockquote>
                </figure>
            );
        }

        function Quiz() {
            const qs = useMemo(() => [
                { q: "Welcher Wirkstoff ist zentral für die antibakterielle Aktivität von Manuka‑Honig?", options: ["Lysozym", "MGO (Methylglyoxal)", "H2O2", "Vitamin C"], correct: 1 },
                { q: "Welcher Praxis‑Vorteil trifft typischerweise zu?", options: ["stärkere Verklebung am Verband", "schneller saubere Granulation", "zwingend systemische AB nötig", "nur bei Pferden einsetzbar"], correct: 1 },
                { q: "Wie groß ist der effektive Preisvorteil beim 2+1‑Bundle?", options: ["10 %", "25 %", "33 %", "50 %"], correct: 2 },
            ], []);
            const [step, setStep] = useState(0);
            const [score, setScore] = useState(0);
            const [picked, setPicked] = useState(null);
            const done = step >= qs.length;

            const onAnswer = () => {
                if (picked === null) return;
                if (picked === qs[step].correct) setScore((s) => s + 1);
                setPicked(null);
                setStep((s) => s + 1);
            };
            
            const restart = () => {
                setStep(0);
                setScore(0);
                setPicked(null);
            }

            if (done) {
                const success = score === qs.length;
                return (
                    <div className="rounded-2xl border border-neutral-200 bg-white p-6 w-full max-w-2xl text-center shadow-sm">
                        <div className="text-lg font-semibold">Ergebnis: {score} / {qs.length}</div>
                        {success ? (
                            <div className="mt-2">
                                <p className="text-lg font-semibold" style={{color: ACCENT}}>Herzlichen Glückwunsch!</p>
                                <p className="text-neutral-700 mt-1">Alle Fragen richtig beantwortet. Sie haben sich <strong>5% Extra-Rabatt</strong> verdient.</p>
                                <div className="mt-4 text-sm text-neutral-800">
                                    Ihr Rabattcode:
                                    <div className="mt-1 text-lg select-all font-mono bg-green-100 text-green-800 border border-green-200 rounded-lg px-3 py-2 inline-block">
                                        QUIZGEWINNER5
                                    </div>
                                </div>
                            </div>
                        ) : (
                           <p className="text-sm text-neutral-700 mt-2">Danke fürs Mitmachen! Versuchen Sie es gern erneut, um den Rabatt zu erhalten.</p>
                        )}
                        <div className="mt-6 flex justify-center gap-4">
                            <a href="#angebot" className="inline-flex justify-center rounded-2xl px-6 py-3 text-white font-semibold shadow" style={{ backgroundColor: ACCENT }}>
                               {success ? 'Jetzt mit Rabatt bestellen' : 'Zum Angebot & Bestellen'}
                            </a>
                            {!success && <button onClick={restart} className="inline-flex justify-center rounded-2xl px-6 py-3 bg-white border border-neutral-300 hover:border-neutral-400 font-semibold">Nochmal versuchen</button>}
                        </div>
                    </div>
                );
            }

            const q = qs[step];
            return (
                <div className="rounded-2xl border border-neutral-200 bg-white p-6 max-w-2xl shadow-sm">
                    <div className="text-sm text-neutral-600">Frage {step + 1} von {qs.length}</div>
                    <div className="text-lg font-semibold mt-1">{q.q}</div>
                    <div className="mt-4 grid gap-2">
                        {q.options.map((opt, idx) => (
                            <button key={idx} onClick={() => setPicked(idx)} className={`w-full text-left rounded-xl border px-4 py-2 transition-colors ${picked === idx ? "bg-green-100 border-green-300 ring-2 ring-green-200" : "bg-white hover:bg-neutral-50 border-neutral-200"}`}>
                                {opt}
                            </button>
                        ))}
                    </div>
                    <div className="mt-4 flex gap-3">
                        <button onClick={onAnswer} disabled={picked === null} className="inline-flex rounded-2xl px-5 py-2 text-white font-semibold disabled:opacity-50 disabled:cursor-not-allowed" style={{ backgroundColor: ACCENT }}>Antwort bestätigen</button>
                        <button onClick={restart} className="inline-flex rounded-2xl px-5 py-2 border bg-white hover:bg-neutral-50">Neu starten</button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
